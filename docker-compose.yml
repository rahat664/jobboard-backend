services:
  jobboard-backend:
    build:
      context: .               # project root
      dockerfile: Dockerfile   # change if your file has a different name or path
    container_name: jobboard-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Set non-secret overrides explicitly
    environment:
      NODE_ENV: production
      PORT: "8080"
      MONGODB_URI: ${MONGODB_URI}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASS: ${ADMIN_PASS}
