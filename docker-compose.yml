services:
  jobboard-backend:
    build:
      context: .               # project root
      dockerfile: Dockerfile   # change if your file has a different name or path
    container_name: jobboard-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Load secrets from an env file (do NOT quote ${VAR} here)
    env_file:
      - .env.production
    # Set non-secret overrides explicitly
    environment:
      NODE_ENV: production
      PORT: "8080"
