services:
  jobboard-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobboard-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      MONGODB_URI: ${MONGODB_URI}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASS: ${ADMIN_PASS}
