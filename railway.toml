# railway.toml — Deployment config for Railway

# --- Build settings (Nixpacks, no Dockerfile required) ---
[build]
builder = "DOCKERFILE"
# builder = "NIXPACKS"  # Uncomment if you want to use Nixpacks instead of Dockerfile
dockerfilePath = "Dockerfile"  # Path to your Dockerfile
# buildCommand = "npm install && npm run build"  # Optional, if you want to run a custom build command

buildCommand = "npm ci && npm run build"

# --- Runtime / Deploy settings ---
[deploy]
startCommand = "node dist/main.js"
restartPolicyType = "on_failure"   # or "always"

# --- Default envs provided at runtime (non-secrets) ---
[variables]
NODE_ENV = "production"
PORT = "8080"
# --- Secrets (set in Railway UI) ---
[secrets]
MONGODB_URI = "mongodb+srv://rahat664:rahatN664@cluster0.ey3th3e.mongodb.net/jobboard_prod"
ADMIN_USER = "mainAdmin"
ADMIN_PASS = "mainPass"

